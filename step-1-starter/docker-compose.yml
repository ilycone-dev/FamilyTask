version: "3.7"

services:
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    security_opt:
      - seccomp:unconfined
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    security_opt:
      - seccomp:unconfined
    environment:
      DATABASE_URL: postgresql://familytask:familytask@db:5432/familytask
      OLLAMA_URL: http://ai:11434
      OLLAMA_MODEL: qwen2.5:3b
    depends_on:
      - db
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: familytask
      POSTGRES_PASSWORD: familytask
      POSTGRES_DB: familytask
    security_opt:
      - seccomp:unconfined
    volumes:
      - pgdata:/var/lib/postgresql/data

