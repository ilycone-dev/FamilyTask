# Blueprint Render pour FamilyTask.
# Déploie : une base Postgres, le backend FastAPI, et le frontend Vue en site statique.
# Doc : https://render.com/docs/blueprint-spec

databases:
  - name: familytask-db
    #plan: starter

services:
  # --- Backend (FastAPI) ---
  - type: web
    name: familytask-backend
    runtime: python
    #plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familytask-db
          property: connectionString

  # --- Frontend (Vue, site statique) ---
  - type: web
    name: familytask-frontend
    runtime: static
    #plan: starter
    rootDir: frontend
    # VITE_API_URL doit être injectée AVANT "npm run build" (Vite la fige
    # dans le code au moment du build, pas au moment où le site est servi).
    buildCommand: npm install && VITE_API_URL="$API_HOST" npm run build
    staticPublishPath: dist
    envVars:
      # RENDER_EXTERNAL_URL est l'URL publique complète (https://...onrender.com)
      # que Render attribue automatiquement au service backend.
      - key: API_HOST
        fromService:
          name: familytask-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      # Toute URL non trouvée (ex: /tasks après un rafraîchissement de page)
      # doit retomber sur index.html, pour que Vue Router prenne le relais.
      - type: rewrite
        source: /*
        destination: /index.html
